<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Natal em Família 2025">
  <defs>
    <linearGradient id="treeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Fundo redondo natalino -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGradient)" />

  <!-- Neve no chão -->
  <path d="M6 46 C 20 40, 44 40, 58 46 L 58 60 L 6 60 Z" fill="#f9fafb" />

  <!-- Tronco -->
  <rect x="29" y="40" width="6" height="10" rx="1" fill="#78350f" />

  <!-- Árvore (três camadas) -->
  <path d="M32 10 L22 24 H42 Z" fill="url(#treeGradient)" />
  <path d="M32 18 L20 32 H44 Z" fill="url(#treeGradient)" />
  <path d="M32 26 L18 40 H46 Z" fill="url(#treeGradient)" />

  <!-- Bolas de Natal -->
  <circle cx="25" cy="28" r="1.4" fill="#f97316" />
  <circle cx="38" cy="30" r="1.4" fill="#ef4444" />
  <circle cx="30" cy="34" r="1.4" fill="#eab308" />
  <circle cx="35" cy="22" r="1.2" fill="#facc15" />

  <!-- Estrela no topo -->
  <polygon points="32,6 33.8,9.5 37.7,10 34.8,12.6 35.6,16.4 32,14.5 28.4,16.4 29.2,12.6 26.3,10 30.2,9.5" fill="#fde047" />

  <!-- Detalhes de brilho -->
  <circle cx="14" cy="16" r="2" fill="#ffffff" opacity="0.35" />
  <circle cx="50" cy="18" r="1.5" fill="#ffffff" opacity="0.3" />
  <circle cx="48" cy="30" r="1.2" fill="#ffffff" opacity="0.25" />
</svg>
